pretrained: true
checkpoint: /home/jovyan/work/training/ECGSynthesis/models/default/2025-11-17_19-36-00/checkpoints/default--val_loss=0.0370-epoch=13.ckpt
mode: test

model:
  model_name: CIRIMECG
  recurrent_layer: IndRNN
  input_channels: 3
  conv_filters:
    - 64
    - 64
    - 1
  conv_kernels:
    - 5
    - 3
    - 3
  conv_dilations:
    - 1
    - 1
    - 1
  conv_bias:
    - true
    - true
    - false
  recurrent_filters:
    - 64
    - 64
    - 0
  recurrent_kernels:
    - 3
    - 3
    - 0
  recurrent_dilations:
    - 1
    - 1
    - 0
  recurrent_bias:
    - true
    - true
    - false
  time_steps: 8
  conv_dim: 2
  num_cascades: 1
  no_dc: true
  depth: 2
  keep_prediction: true
  accumulate_predictions: true
  dimensionality: 2
  reconstruction_loss:
    masked_huber: 0.7
    masked_mse: 0.3
  masked_weight: 3
  normalization_type: null
  unnormalize_loss_inputs: false
  unnormalize_log_outputs: false
  total_reconstruction_loss_weight: 100
  update_in_frequency: false
  hexad_inform: false

  test_ds:
    dataset_format: UniversalECGDataset
    dataset_function: umcu
    waveform_dir: /home/jovyan/work/raw_data/umcu_rhythm
    dataset: /home/jovyan/work/training/ECGSynthesis/dataset/ECGnet_synthesis_test_dataset.csv
    transforms:
      applygain: true
      to12lead: true
      resample:
      - 500
      butterfilter:
        lowcut: 0.3
        highcut: 100
        order: 3
      totensor: true
    mask_args:
      type: layouts
      accelerations:
      - hex
      low_ratio: 0.1
      high_ratio: 0.5
      min_block: 500
      use_seed: true
    normalization_type: null
    use_seed: true
    dataset_number_of_examples: -1
    batch_size: 30
    log_figures: 4
    shuffle: false
    num_workers: 3
    pin_memory: false
    drop_last: false

  optim:
    name: adam
    lr: 1e-4
    betas:
      - 0.9
      - 0.999
    weight_decay: 0.0
    sched:
      name: InverseSquareRootAnnealing
      min_lr: 0.0
      last_epoch: -1
      warmup_ratio: 0.1

trainer:
  strategy: ddp_find_unused_parameters_false
  accelerator: gpu
  devices: [1]
  num_nodes: 1
  max_epochs: 50
  precision: 16-mixed
  enable_checkpointing: false
  logger: false
  log_every_n_steps: 50
  check_val_every_n_epoch: -1
  max_steps: -1

exp_manager:
  exp_dir: /home/jovyan/work/training/ECGSynthesis/results/ECGCIRIM_time/hex
  ema:
    enable: false
  create_tensorboard_logger: true
  create_wandb_logger: false
  wandb_logger_kwargs:
    project: atommic.reconstruction.predictions.SKM-TEA_poisson2d_4x_6x_8x_10x_12x_16x
