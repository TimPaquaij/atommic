model:
  model_name: CIRIMECG
  recurrent_layer: IndRNN
  input_channels: 36
  conv_filters:
    - 64
    - 128
    - 128
    - 12
  conv_kernels:
    - 9
    - 7
    - 5
    - 3
  conv_dilations:
    - 1
    - 2
    - 4
    - 1
  conv_bias:
    - true
    - true
