pretrained: true
checkpoint: /home/jovyan/work/training/ECGSynthesis/models/ECGCIRIM_time_1D/2025-12-04_15-08-04/checkpoints/epoch=60-val_loss=0.0186-last.ckpt

model:
  model_name: CIRIMECG
  recurrent_layer: IndRNN
  input_channels: 36
  conv_filters:
    - 96
    - 192
    - 192
    - 12
  conv_kernels:
    - 9
    - 7
    - 5
    - 3
  conv_dilations:
    - 1
    - 2
    - 4
    - 1
  conv_bias:
    - true
    - true
    - true
    - false
  recurrent_filters:
    - 192
    - 192
    - 96
    - 0
  recurrent_kernels:
    - 3
    - 3
    - 3
    - 0
  recurrent_dilations:
    - 1
    - 2
    - 4
    - 0
  recurrent_bias:
    - true
    - true
    - true
    - false
  time_steps: 8
  conv_dim: 1
  num_cascades: 1
  no_dc: true
  depth: 2
  keep_prediction: true
  accumulate_predictions: true
  dimensionality: 2
  reconstruction_loss:
    masked_huber: 0.3
    masked_mse: 0.5
    spectral_mse: 0.15
    contrastive_loss: 0.001
  masked_weight: 3
  amplitude_weight: 4
  normalization_type: null
  unnormalize_loss_inputs: false
  unnormalize_log_outputs: false
  total_reconstruction_loss_weight: 1
  update_in_frequency: false
  hexad_inform: false

  test_ds:
    dataset_format: UniversalECGDataset
    dataset_function: umcu
    waveform_dir: /home/jovyan/work/raw_data/umcu_rhythm
    dataset: /home/jovyan/work/training/ECGSynthesis/dataset/shd_test_dataset.csv
    params_json: /home/jovyan/work/training/ECGSynthesis/dataset/shd_params.json
    transforms:
      applygain: true
      to12lead: true
      resample:
      - 500
      butterfilter:
        lowcut: 0.3
        highcut: 100
        order: 3
      totensor: true
    mask_args:
      type: layouts
      accelerations:
        - 3x4_1
      low_ratio: 0.1
      high_ratio: 0.5
      min_block: 500
      use_seed: true
    normalization_type: null
    use_seed: true
    dataset_number_of_examples: null
    batch_size: 30
    log_figures: 0
    shuffle: false
    num_workers: 8
    pin_memory: false
    drop_last: false

  optim:
    name: adam
    lr: 1e-4
    betas:
      - 0.9
      - 0.999
    weight_decay: 0.0
    sched:
      name: InverseSquareRootAnnealing
      min_lr: 0.0
      last_epoch: -1
      warmup_ratio: 0.1

trainer:
  strategy: auto
  accelerator: gpu
  devices: [0]
  num_nodes: 1
  max_epochs: 50
  precision: 32
  enable_checkpointing: false
  logger: false
  log_every_n_steps: 50
  check_val_every_n_epoch: -1
  max_steps: -1

exp_manager:
  exp_dir: /home/jovyan/work/training/ECGSynthesis/results/ECGCIRIM_time_1D_3x4_1/3x4_1
  ema:
    enable: false
  create_tensorboard_logger: true
  create_wandb_logger: false
  wandb_logger_kwargs:
