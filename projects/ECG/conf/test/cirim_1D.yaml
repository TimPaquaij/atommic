    - 0
  recurrent_bias:
    - true
    - true
    - true
    - false
  time_steps: 8
  conv_dim: 1
  num_cascades: 3
  no_dc: true
  depth: 2
  keep_prediction: true
  accumulate_predictions: true
  dimensionality: 2
  reconstruction_loss:
    masked_huber: 0.5
    masked_mse: 0.3
    multi_stft: 0.001
    contrastive_loss: 0.001
  masked_weight: 2
  amplitude_weight: 3
  normalization_type: null
  unnormalize_loss_inputs: false
  unnormalize_log_outputs: false
  total_reconstruction_loss_weight: 1
  update_in_frequency: false
  update_parameters: true
  hexad_inform: false

  test_ds:
    dataset_format: UniversalECGDataset
    dataset_function: umcu
    waveform_dir: /home/jovyan/work/raw_data/umcu_rhythm
    median_beat_dir: /home/jovyan/work/ECGSynthesis_data/median_beat
    median_load_params:
      tables:
        - complex_df_p_onset
        - complex_df_p_offset
        - complex_df_qrs_onset
        - complex_df_qrs_offset
        - complex_df_t_onset
        - complex_df_t_offset
    dataset:  /home/jovyan/work/training/ECGSynthesis/dataset/ECGnet_synthesis_test_dataset_clean.csv
    collate_fn: umcu_median
    params_json: null
    transforms:
      applygain: true
      to12lead: true
      resample:
      - 500
      butterfilter:
        lowcut: 0.3
        highcut: 100
        order: 3
      totensor: true
    mask_args:
      type: layouts
      accelerations:
        - hex
      low_ratio: 0.1
      high_ratio: 0.5
      min_block: 500
      use_seed: true
    normalization_type: null
    use_seed: true
    dataset_number_of_examples: null
    batch_size: 20
    log_figures: 0
    shuffle: false
    num_workers: 8
    pin_memory: false
    drop_last: false

  optim:
    name: adam
    lr: 1e-4
    betas:
      - 0.9
      - 0.999
    weight_decay: 0.0
    sched:
      name: InverseSquareRootAnnealing
      min_lr: 0.0
      last_epoch: -1
      warmup_ratio: 0.1

trainer:
  strategy: auto
  accelerator: gpu
  devices: [1]
  num_nodes: 1
  max_epochs: 50
  precision: 32
  enable_checkpointing: false
  logger: false
  log_every_n_steps: 50
  check_val_every_n_epoch: -1
  max_steps: -1

exp_manager:
  exp_dir: /home/jovyan/work/ECGSynthesis_data/results/ECGCIRIM_ISCE/hex
  ema:
