pretrained: false
checkpoint: None
mode: train

model:
  model_name: CIRIMECG
  recurrent_layer: IndRNN
  input_channels: 36
  conv_filters:
    - 64
    - 128
    - 128
    - 12
  conv_kernels:
    - 9
    - 7
    - 5
    - 3
  conv_dilations:
    - 1
    - 2
    - 4
    - 1
  conv_bias:
    - true
    - true
    - true
    - false
  recurrent_filters:
    - 128
    - 128
    - 64
    - 0
  recurrent_kernels:
    - 3
    - 3
    - 3
    - 0
  recurrent_dilations:
    - 1
    - 2
    - 4
    - 0
  recurrent_bias:
    - true
    - true
    - true
    - false
  time_steps: 8
  conv_dim: 1
  num_cascades: 3
  no_dc: true
  depth: 2
  keep_prediction: true
  accumulate_predictions: true
  dimensionality: 2
  reconstruction_loss:
    masked_huber: 0.5
    masked_mse: 0.3
    multi_stft: 0.001
    contrastive_loss: 0.001
  masked_weight: 2
  amplitude_weight: 3
  normalization_type: null
  unnormalize_loss_inputs: false
  unnormalize_log_outputs: false
  total_reconstruction_loss_weight: 1
  update_in_frequency: false
  update_parameters: true
  hexad_inform: false

  train_ds:
    dataset_format: UniversalECGDataset
    dataset_function: umcu
    waveform_dir: /home/jovyan/work/raw_data/umcu_rhythm
    dataset: /home/jovyan/work/training/ECGSynthesis/dataset/ECGnet_synthesis_train_dataset_clean.csv
    transforms:
      applygain: true
      to12lead: true
      resample:
      - 500
      butterfilter:
        lowcut: 0.3
        highcut: 100
        order: 3
      totensor: true
    mask_args:
      type: layouts
      accelerations:
        - random
        - 3x4
        - 3x4_1
        - 6x2
        - hex
        - single_lead
      low_ratio: 0.1
      high_ratio: 0.5
      min_block: 500
      use_seed: false
    normalization_type: null
    noise_augmentations: null
    use_seed: false
    dataset_number_of_examples: null
    batch_size: 18
    shuffle: true
    num_workers: 10
    pin_memory: false
    drop_last: false
  
  validation_ds:
    dataset_format: UniversalECGDataset
    dataset_function: umcu
    waveform_dir: /home/jovyan/work/raw_data/umcu_rhythm
    dataset: /home/jovyan/work/training/ECGSynthesis/dataset/ECGnet_synthesis_validation_dataset_clean.csv
    transforms:
      applygain: true
      to12lead: true
      resample:
      - 500
      butterfilter:
        lowcut: 0.3
        highcut: 100
        order: 3
      totensor: true
    mask_args:
      type: layouts
      accelerations:
        - random
        - 3x4
        - 3x4_1
        - 6x2
        - hex
        - single_lead
      low_ratio: 0.1
      high_ratio: 0.5
      min_block: 500
      use_seed: true
    normalization_type: null
    noise_augmentations: false
    use_seed: true
    dataset_number_of_examples: null
    batch_size: 18
    log_figures: 4
    shuffle: false
    num_workers: 10
    pin_memory: false
    drop_last: false

  optim:
    name: adam
    lr: 1e-4
    betas:
      - 0.9
      - 0.999
    weight_decay: 0.0
    sched:
      name: InverseSquareRootAnnealing
      min_lr: 0.0
      last_epoch: -1
      warmup_ratio: 0.1

trainer:
  strategy: auto
  accelerator: gpu
  devices: [0]
  num_nodes: 1
  max_epochs: 45
  precision: 16
  enable_checkpointing: false
  logger: false
  log_every_n_steps: 100
  check_val_every_n_epoch: -1
  max_steps: -1

exp_manager:
  exp_dir: /home/jovyan/work/training/ECGSynthesis/models
  name: ECGCIRIM_time_1D_cascade
  create_tensorboard_logger: true
  summary_writer_kwargs:
    flush_secs: 30
  create_early_stopping_callback: true
  early_stopping_callback_params:
    monitor: val_loss
    patience: 5
    mode: min
    strict: true
    min_delta: 0.0005 # minimum change to qualify as an improvement
  create_checkpoint_callback: true
  checkpoint_callback_params:
    monitor: val_loss
    mode: min
    save_top_k: 3
    save_last: true
    filename: "{epoch}-{val_loss:.4f}"
  ema:
    enable: false
  create_wandb_logger: false
  wandb_logger_kwargs:
    project: atommic.reconstruction.ECG
