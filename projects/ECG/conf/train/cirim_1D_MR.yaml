pretrained: false
checkpoint: None
mode: train

model:
  model_name: CIRIMECG
  recurrent_layer: IndRNN
  input_channels: 36
  conv_filters:
    - 96
    - 192
    - 192
    - 12
  conv_kernels:
    - 9
    - 7
    - 5
    - 3
  conv_dilations:
    - 1
    - 2
    - 4
    - 1
  conv_bias:
    - true
    - true
    - true
    - false
  recurrent_filters:
    - 192
    - 192
    - 96
    - 0
  recurrent_kernels:
    - 3
    - 3
    - 3
    - 0
  recurrent_dilations:
    - 1
    - 2
    - 4
    - 0
  recurrent_bias:
    - true
    - true
    - true
    - false
  time_steps: 8
  conv_dim: 1
  num_cascades: 1
  no_dc: true
  depth: 2
  keep_prediction: true
  accumulate_predictions: true
  dimensionality: 2
  reconstruction_loss:
    masked_huber: 0.3
    masked_mse: 0.5
    spectral_mse: 0.15
    contrastive_loss: 0.001
  masked_weight: 3
  amplitude_weight: 4
  normalization_type: null
  unnormalize_loss_inputs: false
  unnormalize_log_outputs: false
  total_reconstruction_loss_weight: 1
  update_in_frequency: false
  hexad_inform: false

  train_ds:
    dataset_format: UniversalECGDataset
    dataset_function: umcu
    waveform_dir: /home/jovyan/work/raw_data/umcu_rhythm
    dataset: /home/jovyan/work/training/ECGSynthesis/dataset/ECGnet_synthesis_train_dataset.csv
    transforms:
      applygain: true
      to12lead: true
      resample:
      - 500
      butterfilter:
        lowcut: 0.3
        highcut: 100
        order: 3
      totensor: true
    mask_args:
      type: layouts
      accelerations:
        - random
        - 3x4
        - 3x4_1
        - 6x2
        - hex
      low_ratio: 0.1
      high_ratio: 0.5
      min_block: 500
      use_seed: false
    normalization_type: null
    use_seed: false
    dataset_number_of_examples: -1
    batch_size: 18
    shuffle: true
    num_workers: 10
    pin_memory: false
    drop_last: false
  
  validation_ds:
    dataset_format: UniversalECGDataset
    dataset_function: umcu
    waveform_dir: /home/jovyan/work/raw_data/umcu_rhythm
    dataset: /home/jovyan/work/training/ECGSynthesis/dataset/ECGnet_synthesis_validation_dataset.csv
    transforms:
      applygain: true
      to12lead: true
      resample:
      - 500
      butterfilter:
        lowcut: 0.3
        highcut: 100
        order: 3
      totensor: true
    mask_args:
      type: layouts
      accelerations:
      - random
      - 3x4
      - 3x4_1
      - 6x2
      - hex
      low_ratio: 0.1
      high_ratio: 0.5
      min_block: 500
      use_seed: true
    normalization_type: null
    use_seed: true
    dataset_number_of_examples: -1
    batch_size: 18
    log_figures: 4
    shuffle: false
    num_workers: 10
    pin_memory: false
    drop_last: false

  optim:
    name: adam
    lr: 1e-4
    betas:
      - 0.9
      - 0.999
    weight_decay: 0.0
    sched:
      name: InverseSquareRootAnnealing
      min_lr: 0.0
      last_epoch: -1
      warmup_ratio: 0.1

trainer:
  strategy: auto
  accelerator: gpu
  devices: [0]
  num_nodes: 1
  max_epochs: 60
  precision: 16
  enable_checkpointing: false
  logger: false
  log_every_n_steps: 100
  check_val_every_n_epoch: -1
  max_steps: -1

exp_manager:
  exp_dir: /home/jovyan/work/training/ECGSynthesis/models
  name: ECGCIRIM_time_1D
  create_tensorboard_logger: true
  summary_writer_kwargs:
    flush_secs: 30
  create_early_stopping_callback: true
  early_stopping_callback_params:
    monitor: val_loss
    patience: 5
    mode: min
    strict: true
    min_delta: 0.001 # minimum change to qualify as an improvement
  create_checkpoint_callback: true
  checkpoint_callback_params:
    monitor: val_loss
    mode: min
    save_top_k: 1
    save_last: true
    filename: "{epoch}-{val_loss:.4f}"
  ema:
    enable: false
  create_wandb_logger: false
  wandb_logger_kwargs:
    project: atommic.reconstruction.ECG
    
# Required for Hydra launch of hyperparameter search via multirun
defaults:
  - override hydra/launcher: atommic_launcher

# Hydra arguments necessary for hyperparameter optimization
hydra:
  # Helper arguments to ensure all hyper parameter runs are from the directory that launches the script.
  sweep:
    dir: "."
    subdir: "."

  # Define all the hyper parameters here
  sweeper:
    params:
      # Place all the parameters you wish to search over here (corresponding to the rest of the config)
      # NOTE: Make sure that there are no spaces between the commas that separate the config params !
      model.conv_filters: "[32,64,64,12],[64,128,128,12],[96,192,192,12]"
      model.recurrent_filters: "[64,64,32,0],[128,128,64,0],[192,192,96,0]"
      model.reconstruction_loss.contrastive_loss: 0.0,0.01,0.1
      model.num_cascades: 1,2,3

  # Arguments to the process launcher
  launcher:
    num_gpus: -1  # Number of gpus to use. Each run works on a single GPU.
    jobs_per_gpu: 2  # If each GPU has large memory, you can run multiple jobs on the same GPU for faster results (until OOM).
