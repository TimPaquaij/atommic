pretrained: false
checkpoint: None
mode: train

model:
  model_name: CIRIMECG
  recurrent_layer: IndRNN
  input_channels: 3 # liklihood and prediction since 2D conv a spatial dim is added
  conv_filters:
    - 32
    - 64
    - 1
  conv_kernels:
    - 5
    - 3
    - 3
  conv_dilations:
    - 1
    - 2
    - 1
  conv_bias:
    - true
    - true
    - false
  recurrent_filters:
    - 32
    - 64
    - 0
  recurrent_kernels:
    - 1
    - 1
    - 0
  recurrent_dilations:
    - 1
    - 1
    - 0
  recurrent_bias:
    - true
    - true
    - false
  depth: 2
  time_steps: 8
  conv_dim: 2
  num_cascades: 3
  no_dc: true
  keep_prediction: true
  accumulate_predictions: true
  dimensionality: 2
  reconstruction_loss:
    l1: 1
  normalization_type: zscore  # none, zscore, minmax
  unnormalize_loss_inputs: false #Search if this can be removed
  unnormalize_log_outputs: false #Search if this can be removed
  kspace_reconstruction_loss: false #Search if this can be removed
  total_reconstruction_loss_weight: 100
  complex_valued_type: stacked  # stacked, complex_abs, complex_sqrt_abs
  coil_combination_method: SENSE #Search if this can be removed
  ssdu: false #Search if this can be removed
  n2r: false #Search if this can be removed
  fft_centered: true #Search if this can be removed
  fft_normalization: ortho #Search if this can be removed
  spatial_dims: #Search if this can be removed
    - -2 #Search if this can be removed
    - -1 #Search if this can be removed
  coil_dim: 1 #Search if this can be removed
  estimate_coil_sensitivity_maps_with_nn: false #Search if this can be removed
  consecutive_slices: 1 #Search if this can be removed

  train_ds:
    dataset_format: UniversalECGDataset
    dataset_function: umcu
    waveform_dir: /home/jovyan/work/raw_data/umcu_rhythm
    dataset: /home/jovyan/work/training/ECGDigitization/dataset/ECGnet_digitization_train_dataset.csv
    transforms:
      applygain: true
      resample:
        - 500
      totensor: true
      to12lead: true
    # normalization:
    #     type: zscore
    mask_args:
      type: layouts  # the mask will be loaded from the dataset, but we need to specify the type here
      accelerations:
        - "random"
      shift_mask: false
      use_seed: false
    use_seed: false
    dataset_number_of_examples: 100000
    batch_size: 25
    shuffle: true
    num_workers: 3
    pin_memory: false
    drop_last: false

  validation_ds:
    dataset_format: UniversalECGDataset
    dataset_function: umcu
    waveform_dir: /home/jovyan/work/raw_data/umcu_rhythm
    dataset: /home/jovyan/work/training/ECGDigitization/dataset/ECGnet_digitization_val_dataset.csv
    transforms:
      applygain: true
      resample:
        - 500
      totensor: true
      to12lead: true
      # normalization:
      #   type: zscore
    mask_args:
      type: layouts  # the mask will be loaded from the dataset, but we need to specify the type here
      accelerations:
        - "random"
      shift_mask: false
      use_seed: true
    use_seed: true
    dataset_number_of_examples: 10000
    batch_size: 25
    log_figures: 4
    shuffle: False
    num_workers: 10
    pin_memory: false
    drop_last: false

  optim:
    name: adamw
    lr: 1e-3
    betas:
      - 0.9
      - 0.999
    weight_decay: 1e-4
    sched:
      name: InverseSquareRootAnnealing
      min_lr: 0.0
      last_epoch: -1
      warmup_ratio: 0.1

trainer:
  strategy: auto
  accelerator: gpu
  devices: [0]
  num_nodes: 1
  max_epochs: 50
  precision: 32
  enable_checkpointing: false
  logger: false
  log_every_n_steps: 1000
  check_val_every_n_epoch: -1
  max_steps: -1

exp_manager:
  exp_dir: Results/CIRIMECG/
  ema:
    enable: false
  create_tensorboard_logger: true
  create_wandb_logger: false
  wandb_logger_kwargs:
    project: atommic.reconstruction.ECG
